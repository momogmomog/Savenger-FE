<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Transactions</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="presentFilterOptions()">
        <ion-icon slot="icon-only" [name]="TransactionUtils.getFilterIcon(isFiltering())"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="slider-container">
    <app-budget-slider></app-budget-slider>
  </div>

  <div class="transaction-quick-actions ion-padding-vertical">
    <div class="quick-action-item" (click)="openAddTransaction(TransactionType.EXPENSE)">
      <div class="quick-action-btn expense">
        <ion-icon [name]="TransactionUtils.getActionIcon(TransactionType.EXPENSE)"></ion-icon>
      </div>
      <span>Expense</span>
    </div>

    <div class="quick-action-item" (click)="openAddTransaction(TransactionType.INCOME)">
      <div class="quick-action-btn income">
        <ion-icon [name]="TransactionUtils.getActionIcon(TransactionType.INCOME)"></ion-icon>
      </div>
      <span>Income</span>
    </div>

    <div class="quick-action-item" (click)="openTransfers()">
      <div class="quick-action-btn transfer">
        <ion-icon name="swap-horizontal-outline"></ion-icon>
      </div>
      <span>Transfer</span>
    </div>

    <div class="quick-action-item" (click)="showMoreTransactionOptions()">
      <div class="quick-action-btn other">
        <ion-icon name="ellipsis-horizontal-outline"></ion-icon>
      </div>
      <span>More</span>
    </div>
  </div>

  <div style="margin: 10px;">
    <app-recurring-transactions-preview
      (updateTriggered)="transactionsChanged()"
      [externalUpdateTrigger]="recurringTransactionUpdateTrigger()"
      [budgetId]="budget().id"></app-recurring-transactions-preview>
  </div>

  @for (group of groupedTransactions(); track group.dateLabel) {

    <div class="ion-padding-start ion-padding-bottom ion-margin-top">
      <ion-text color="medium">
        <small class="transaction-group-date-header">
          {{ group.dateObj | date:'mediumDate' }}
        </small>
      </ion-text>
    </div>

    <ion-card class="transaction-group-card">

      <ion-list lines="none" class="ion-no-padding">
        @for (item of group.items; track item.id; let last = $last) {
          <app-transaction-card
            (onClick)="onTransactionClick($event)"
            [transaction]="item"
            [categoryName]="getCategoryName(item.categoryId)">
          </app-transaction-card>
        }
      </ion-list>

    </ion-card>

  } @empty {
    <div class="empty-list-placeholder ion-margin-top">
      <p>No transactions found</p>
    </div>
  }

  <ion-infinite-scroll [disabled]="!hasNextPage()" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles"></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
