<ion-item
  [button]="true"
  [detail]="true"
  (click)="onClick.emit(debt())">
  <ion-icon
    slot="start"
    [name]="isSettled() ? 'checkmark-circle-outline' : (isBorrower() ? 'arrow-down-circle-outline' : 'arrow-up-circle-outline')"
    [color]="isSettled() ? 'medium' : (isBorrower() ? 'danger' : 'success')">
  </ion-icon>

  <ion-label>
    <div class="debt-item-title-row">
      <h3>{{ counterpartBudgetName() }}</h3>
      <span
        class="indicator-pill uppercase"
        [ngClass]="isSettled() ? 'medium' : (isBorrower() ? 'expense' : 'income')">
        {{ isBorrower() ? 'Borrowed' : 'Lent' }}
      </span>
    </div>
    <p>
      @if (isSettled()) {
        Settled •
      }
      {{ displayDate() | date: 'mediumDate' }}
    </p>
  </ion-label>

  <div slot="end" class="ion-text-end">
    <strong
      [ngClass]="isSettled() ? 'text-medium' : (isBorrower() ? 'text-expense' : 'text-income')">
      {{ debt().amount | currency }}
    </strong>
  </div>
</ion-item>
