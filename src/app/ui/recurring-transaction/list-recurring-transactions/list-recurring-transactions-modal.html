<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="recurring-filter-toolbar ion-padding-horizontal ion-padding-top">
    <ion-button
      fill="clear"
      size="small"
      class="recurring-filter-btn"
      color="medium"
      (click)="presentFilterOptions()">
      <ion-icon slot="start" [name]="TransactionUtils.getFilterIcon(isFiltering())"></ion-icon>
      Filters
    </ion-button>
  </div>

  @for (group of groupedTransactions(); track group.dateLabel) {
    <div class="ion-padding-start ion-padding-bottom ion-margin-top">
      <ion-text color="medium">
        <small class="transaction-group-date-header">
          {{ group.dateObj | date:'mediumDate' }}
        </small>
      </ion-text>
    </div>

    <ion-card class="transaction-group-card">
      <ion-list lines="none" class="ion-no-padding">
        @for (item of group.items; track item.id; let last = $last) {
          <app-recurring-transaction-card
            [transaction]="item"
            [categoryName]="budgetSliderService.getCategoryName(item.categoryId)"
            (onClick)="onTransactionClick($event)">
          </app-recurring-transaction-card>
        }
      </ion-list>
    </ion-card>
  } @empty {
    <div class="empty-list-placeholder ion-margin-top">
      <ion-icon name="time-outline" class="empty-list-icon"></ion-icon>
      <p>No upcoming transactions found.</p>
    </div>
  }

  <ion-infinite-scroll [disabled]="!hasNextPage()" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles"></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
