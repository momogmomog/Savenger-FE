<app-select-search
  label="Tag"
  placeholder="Pick Tags"
  [payload]="payload()"
  [clearOnSelect]="true"
  [(searchTerm)]="searchTerm"
  (selectionChange)="onSelectionChange($event)"
  (loadMore)="onLoadMore($event)">
</app-select-search>

@if (selectedItems().length > 0) {
  <div class="tags-container ion-padding-top">
    @for (tag of selectedItems(); track tag.id) {
      <ion-chip (click)="removeItem(tag.id)" [outline]="true" color="medium">
        <ion-label>{{ tag.tagName }}</ion-label>
        <ion-icon name="close-circle"></ion-icon>
      </ion-chip>
    }
  </div>
}
